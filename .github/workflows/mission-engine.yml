name: Mission Engine

on:
  pull_request:
  push:
    branches: [main, "foundation/**", "feature/**"]

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: runner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner -d runner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://runner:runner@localhost:5432/runner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run typecheck
