name: Documentation validation

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".env.example"
      - ".github/workflows/docs-validation.yml"
  push:
    branches:
      - main
      - "docs/**"
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".env.example"
      - ".github/workflows/docs-validation.yml"

permissions:
  contents: read

jobs:
  openapi:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml
