name: Android bundle validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install application dependencies
        shell: bash
        run: |
          if [[ ! -f package.json || ! -f app.json ]]; then
            echo "Expo application files are not present on this ref yet; Android bundle validation will run once the app foundation is integrated."
            exit 0
          fi
          npm install --no-audit --no-fund
      - name: Export Android JavaScript bundle
        if: hashFiles('package.json') != '' && hashFiles('app.json') != ''
        run: npx expo export --platform android
