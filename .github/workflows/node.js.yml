name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up supported Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and validate application
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "No Node application is present on this ref yet; validation will run once the application foundation is integrated."
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run build --if-present
          npm run typecheck --if-present
          npm test
