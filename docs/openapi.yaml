openapi: 3.1.0
info:
  title: RUNNER Mission API
  version: 0.2.0
  description: Initial mission command API. Provider adapters and production deployment are not yet configured.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; no production endpoint is deployed.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200':
          description: Process is responding
  /v1/missions:
    post:
      summary: Create a mission draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms]
              properties:
                terms:
                  $ref: '#/components/schemas/MissionTerms'
      responses:
        '201':
          description: Mission draft created
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '422': { $ref: '#/components/responses/ApiError' }
  /v1/missions/{missionId}:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      summary: Read an authorized mission
      responses:
        '200':
          description: Mission projection
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/missions/{missionId}/quote:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    post:
      summary: Calculate and attach a trusted quote
      description: Client cannot submit pricing values. Quote is calculated by the injected server-side pricing policy.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Quote attached; returns updated mission projection }
        '400': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/missions/{missionId}/publish:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    post:
      summary: Publish a quoted mission
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Mission published; returns updated mission projection }
        '403': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/missions/{missionId}/tracking:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      summary: Read an authorized mission and relay tracking projection
      description: Requesters and assigned Runners may read their mission. Dispatch and trust roles require server-side authorization. Location is returned only while active-mission consent is enabled and the snapshot is fresh.
      responses:
        '200':
          description: Mission and relay tracking projection
        '401': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
  /v1/runner/availability:
    get:
      summary: Read the authenticated Runner's availability windows
      responses:
        '200':
          description: Availability windows
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
    post:
      summary: Create an availability window for the authenticated Runner
      description: Runner identity is derived from the verified bearer principal, never from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerAvailabilityInput'
      responses:
        '200': { description: Availability window recorded }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /v1/runner/offers:
    get:
      summary: Read the authenticated Runner's active offer inbox
      responses:
        '200':
          description: Unexpired offers for open mission legs
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /v1/runner/offers/respond:
    post:
      summary: Accept or decline an offer assigned to the authenticated Runner
      description: Acceptance revalidates eligibility and commits assignment atomically. Repeated responses are handled by the offer lifecycle command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerOfferDecision'
      responses:
        '200': { description: Offer response committed or replayed }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
        '410': { description: Offer expired }
  /v1/operations/dispatch-queue:
    get:
      summary: Read the operational dispatch queue
      description: Requires a server-authorized dispatcher or trust-operator principal. Safety holds and disputes are prioritized. Location is consented and freshness-limited.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
      responses:
        '200':
          description: Dispatch queue with mission, leg, offer and fresh Runner location projections
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '400': { $ref: '#/components/responses/ApiError' }
  /v1/operations/incidents:
    get:
      summary: Read the prioritized incident and dispute queue
      description: Trust-operator only. Critical and high severity cases are prioritized; evidence is returned as opaque references only.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
      responses:
        '200': { description: "Open, triaged and investigating incidents" }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '400': { $ref: '#/components/responses/ApiError' }
  /v1/incidents:
    post:
      summary: Report an operational incident or dispute
      description: Requesters and assigned Runners may report against their mission; dispatcher and trust-operator roles are server-authorized. Evidence references are opaque identifiers, not raw media or personal data.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReport'
      responses:
        '200': { description: Incident created or idempotently replayed }
        '400': { $ref: '#/components/responses/ApiError' }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
  /v1/incidents/{incidentId}/transition:
    post:
      summary: Transition an incident as a trust operator
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTransition'
      responses:
        '200': { description: Incident transition committed }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
  /v1/missions/{missionId}/safety-hold:
    post:
      summary: Place an audited mission safety hold
      description: Trust-operator only. Terminal missions cannot be placed on hold. Repeated commands are idempotent.
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, idempotencyKey]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Safety hold placed or replayed }
        '403': { $ref: '#/components/responses/ApiError' }
        '404': { $ref: '#/components/responses/ApiError' }
        '409': { $ref: '#/components/responses/ApiError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Documentation placeholder; verifier implementation is deployment-specific and not yet configured.
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected mission version as an entity tag.
      schema: { type: string }
  schemas:
    Address:
      type: object
      required: [countryCode, locality, addressLine]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        locality: { type: string, minLength: 1 }
        addressLine: { type: string, minLength: 1 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    MissionTerms:
      type: object
      required: [category, description, currency, declaredValueMinor, weightGrams, pickup, destination, requiredCapabilities]
      properties:
        category:
          type: string
          enum: [document, parcel, retail_collection, other]
        description: { type: string, minLength: 3, maxLength: 2000 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        declaredValueMinor: { type: integer, minimum: 0 }
        weightGrams: { type: integer, minimum: 0 }
        pickup: { $ref: '#/components/schemas/Address' }
        destination: { $ref: '#/components/schemas/Address' }
        requiredCapabilities:
          type: array
          items: { type: string, maxLength: 80 }
        requiredVehicleClass:
          type: string
          enum: [foot, bicycle, motorcycle, car, van]
    IncidentReport:
      type: object
      additionalProperties: false
      required: [missionId, idempotencyKey, category, severity, title, description]
      properties:
        missionId: { type: string, format: uuid }
        legId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        category: { type: string, enum: [safety, loss, damage, delay, custody_dispute, suspected_fraud, customs, other] }
        severity: { type: string, enum: [low, medium, high, critical] }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 3, maxLength: 4000 }
        evidenceRefs:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 128, pattern: '^[^\\s]+      type: object
      additionalProperties: false
      required: [availableFrom, availableUntil, status]
      properties:
        availableFrom: { type: string, format: date-time }
        availableUntil: { type: string, format: date-time }
        status: { type: string, enum: [available, unavailable] }
    RunnerOfferDecision:
      type: object
      additionalProperties: false
      required: [offerId, decision]
      properties:
        offerId: { type: string, format: uuid }
        decision: { type: string, enum: [accept, decline] }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    ApiError:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
 }
    IncidentTransition:
      type: object
      additionalProperties: false
      required: [expectedVersion, nextStatus, idempotencyKey]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        nextStatus: { type: string, enum: [triaged, investigating, resolved, dismissed] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        assignedOperatorId: { type: string, format: uuid }
        resolutionCode: { type: string, minLength: 2, maxLength: 80 }
        resolutionNote: { type: string, minLength: 3, maxLength: 1000 }
    RunnerAvailabilityInput:
      type: object
      additionalProperties: false
      required: [availableFrom, availableUntil, status]
      properties:
        availableFrom: { type: string, format: date-time }
        availableUntil: { type: string, format: date-time }
        status: { type: string, enum: [available, unavailable] }
    RunnerOfferDecision:
      type: object
      additionalProperties: false
      required: [offerId, decision]
      properties:
        offerId: { type: string, format: uuid }
        decision: { type: string, enum: [accept, decline] }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    ApiError:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
